<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ders Tamamlandı — LinguaFlow</title>

    <style>
:root {
    --green: #58cc02;
    --green-dark: #46a302;
    --green-soft: #efffe7;

    --bg: #f7f9fc;
    --white: #ffffff;

    --text: #172033;
    --muted: #7c8799;
    --border: #e5eaf0;

    --red: #ff4b4b;
    --blue: #4f7cff;

    --shadow: 0 12px 35px rgba(23,32,51,.09);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;

    background: var(--bg);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Inter",
        sans-serif;

    color: var(--text);

    -webkit-font-smoothing: antialiased;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px;
}

/* =========================
   CARD
========================= */

.card {
    position: relative;

    width: min(510px, 100%);

    padding: 46px 42px 38px;

    background: var(--white);

    border: 1px solid var(--border);
    border-radius: 28px;

    box-shadow: var(--shadow);

    text-align: center;

    overflow: hidden;

    animation: appear .35s ease;
}

.card::before {
    content: "";

    position: absolute;

    left: -70px;
    top: -80px;

    width: 190px;
    height: 190px;

    border-radius: 50%;

    background: var(--green-soft);
}

.card::after {
    content: "";

    position: absolute;

    right: -90px;
    bottom: -100px;

    width: 210px;
    height: 210px;

    border-radius: 50%;

    background: #f1f5ff;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================
   EMOJI
========================= */

.emoji {
    position: relative;
    z-index: 1;

    width: 92px;
    height: 92px;

    display: grid;
    place-items: center;

    margin: 0 auto 22px;

    background: var(--green-soft);

    border: 1px solid #d4f2c0;

    border-radius: 28px;

    font-size: 48px;

    box-shadow:
        0 8px 20px rgba(88,204,2,.12);

    animation: pop .45s cubic-bezier(.2,.8,.2,1);
}

@keyframes pop {
    from {
        opacity: 0;
        transform: scale(.7) rotate(-8deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

/* =========================
   TITLE
========================= */

.card h1 {
    position: relative;
    z-index: 1;

    margin: 0;

    font-size: 31px;
    font-weight: 900;
    letter-spacing: -.8px;
}

.subtitle {
    position: relative;
    z-index: 1;

    margin-top: 8px;

    color: var(--muted);

    font-size: 15px;
    font-weight: 700;
}

/* =========================
   STATS
========================= */

.stats {
    position: relative;
    z-index: 1;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-top: 30px;
}

.stat {
    padding: 19px 14px;

    background: #fafbfc;

    border: 1px solid var(--border);
    border-radius: 18px;
}

.stat-icon {
    font-size: 21px;
}

.stat-value {
    margin-top: 7px;

    font-size: 18px;
    font-weight: 900;
}

.stat-value.xp {
    color: var(--green-dark);
}

.stat-value.hearts {
    color: #e84444;
}

/* =========================
   BUTTON
========================= */

.button {
    position: relative;
    z-index: 1;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 54px;

    margin-top: 26px;

    border-radius: 15px;

    background: var(--green);

    color: white;

    font-size: 14px;
    font-weight: 900;

    box-shadow:
        0 4px 0 var(--green-dark);

    transition:
        transform .12s ease,
        background .12s ease;
}

.button:hover {
    background: #61d609;
}

.button:active {
    transform: translateY(4px);
    box-shadow: none;
}

/* =========================
   SECONDARY
========================= */

.secondary {
    position: relative;
    z-index: 1;

    display: block;

    margin-top: 20px;

    color: var(--muted);

    font-size: 13px;
    font-weight: 800;

    transition: color .15s ease;
}

.secondary:hover {
    color: var(--green-dark);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 550px) {

    body {
        padding: 16px;
    }

    .card {
        padding: 36px 22px 30px;

        border-radius: 23px;
    }

    .emoji {
        width: 78px;
        height: 78px;

        font-size: 40px;

        border-radius: 23px;
    }

    .card h1 {
        font-size: 27px;
    }

    .stats {
        gap: 9px;
    }

    .stat {
        padding: 16px 10px;
    }
}
</style>
    
</head>

<body>

<div class="card">

    <div class="emoji">
        🎉
    </div>

    <h1>
        Ders tamamlandı!
    </h1>

    <div class="subtitle">
        Harika iş çıkardın, {{ user.username }}!
    </div>


    <div class="stats">

        <div class="stat">

            <div class="stat-icon">
                ⚡
            </div>

            <div class="stat-value xp">
                +{{ xp_earned }} XP
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ❤️
            </div>

            <div class="stat-value hearts">
                {{ user.hearts }}
            </div>

        </div>

    </div>


    <a
        href="/dashboard"
        class="button"
    >
        DEVAM ET →
    </a>


    <a
        href="/lesson/{{ lesson.id }}"
        class="secondary"
    >
        Dersi tekrar et
    </a>

</div>

</body>
</html>
