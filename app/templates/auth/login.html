<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LinguaFlow — Giriş</title>

    
<style>
:root {
    --bg: #f7f9fc;
    --card: #ffffff;
    --text: #172033;
    --muted: #7c8799;
    --green: #58cc02;
    --green-dark: #46a302;
    --green-soft: #efffe7;
    --border: #e5eaf0;
    --red: #ff4b4b;
    --red-soft: #fff0f0;
    --shadow: 0 18px 45px rgba(23, 32, 51, .08);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;

    background:
        radial-gradient(circle at 15% 20%, rgba(88, 204, 2, .08), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(88, 204, 2, .06), transparent 30%),
        var(--bg);

    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Inter",
        system-ui,
        sans-serif;
}

.card {
    width: 100%;
    max-width: 430px;
    position: relative;

    padding: 42px 40px 34px;

    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow);

    animation: cardIn .45s ease-out;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(14px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Decorative circle */

.card::before {
    content: "";
    position: absolute;

    width: 130px;
    height: 130px;

    top: -55px;
    right: -55px;

    border-radius: 50%;
    background: var(--green-soft);

    z-index: 0;
}

.card::after {
    content: "";
    position: absolute;

    width: 80px;
    height: 80px;

    bottom: -35px;
    left: -35px;

    border-radius: 50%;
    background: #eef4ff;

    z-index: 0;
}

.logo,
h1,
p,
form,
.register {
    position: relative;
    z-index: 1;
}

/* Logo */

.logo {
    width: 82px;
    height: 82px;

    margin: 0 auto 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--green-soft);
    border: 1px solid #d8f2c6;

    border-radius: 24px;

    font-size: 43px;

    box-shadow:
        0 7px 0 #d8efca,
        0 14px 25px rgba(88, 204, 2, .10);

    animation: owlPop .5s ease-out;
}

@keyframes owlPop {
    0% {
        opacity: 0;
        transform: scale(.7) rotate(-8deg);
    }

    70% {
        transform: scale(1.05) rotate(2deg);
    }

    100% {
        transform: scale(1) rotate(0);
    }
}

/* Heading */

h1 {
    margin: 0;

    text-align: center;

    font-size: 30px;
    line-height: 1.15;
    font-weight: 900;
    letter-spacing: -.7px;

    color: var(--text);
}

p {
    margin: 12px 0 28px;

    text-align: center;

    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
}

/* Error */

.error {
    position: relative;
    z-index: 2;

    margin-bottom: 20px;
    padding: 13px 15px;

    border: 1px solid #ffd0d0;
    border-radius: 13px;

    background: var(--red-soft);
    color: #d93636;

    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
}

/* Form */

form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

label {
    margin-top: 7px;

    color: var(--text);

    font-size: 14px;
    font-weight: 800;
}

input {
    width: 100%;
    height: 52px;

    padding: 0 15px;

    border: 2px solid var(--border);
    border-radius: 14px;

    outline: none;

    background: #fff;
    color: var(--text);

    font-family: inherit;
    font-size: 15px;

    transition:
        border-color .15s ease,
        box-shadow .15s ease,
        transform .15s ease;
}

input::placeholder {
    color: #aab2bf;
}

input:hover {
    border-color: #d5dce5;
}

input:focus {
    border-color: var(--green);

    box-shadow:
        0 0 0 4px var(--green-soft);

    transform: translateY(-1px);
}

/* Submit */

button {
    width: 100%;
    height: 54px;

    margin-top: 14px;

    border: 0;
    border-radius: 14px;

    background: var(--green);
    color: #fff;

    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: .1px;

    cursor: pointer;

    box-shadow: 0 4px 0 var(--green-dark);

    transition:
        transform .12s ease,
        background .12s ease,
        box-shadow .12s ease;
}

button:hover {
    background: #61d609;
    transform: translateY(-1px);
}

button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--green-dark);
}

/* Register */

.register {
    margin-top: 25px;
    padding-top: 22px;

    border-top: 1px solid var(--border);

    text-align: center;

    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
}

.register a {
    margin-left: 4px;

    color: var(--green-dark);
    text-decoration: none;
    font-weight: 900;
}

.register a:hover {
    text-decoration: underline;
}

/* Mobile */

@media (max-width: 520px) {
    body {
        padding: 16px;
        align-items: flex-start;
        padding-top: 35px;
    }

    .card {
        padding: 34px 24px 28px;
        border-radius: 24px;
    }

    .logo {
        width: 72px;
        height: 72px;
        font-size: 37px;
        border-radius: 21px;
    }

    h1 {
        font-size: 27px;
    }
}
</style>

</head>

<body>

<div class="card">

    <div class="logo">🦉</div>

    <h1>Tekrar hoş geldin!</h1>

    <p>
        Öğrenmeye kaldığın yerden devam et.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">

        <label>E-posta</label>

        <input
            type="email"
            name="email"
            value="{{ email or '' }}"
            required
        >

        <label>Şifre</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Giriş Yap →
        </button>

    </form>

    <div class="register">
        Hesabın yok mu?
        <a href="/auth/register">
            Kayıt ol
        </a>
    </div>

</div>

</body>
</html>
