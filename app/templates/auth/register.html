<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LinguaFlow — Kayıt Ol</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}"
    >

    
<style>
:root {
    --bg: #f7f9fc;
    --card: #ffffff;
    --text: #172033;
    --muted: #7c8799;
    --green: #58cc02;
    --green-dark: #46a302;
    --green-soft: #efffe7;
    --border: #e5eaf0;
    --red: #ff4b4b;
    --red-soft: #fff0f0;
    --shadow: 0 18px 45px rgba(23, 32, 51, .08);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;

    background:
        radial-gradient(circle at 15% 20%, rgba(88, 204, 2, .08), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(88, 204, 2, .06), transparent 30%),
        var(--bg);

    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Inter",
        system-ui,
        sans-serif;
}

.site-footer {
    width: min(430px, 100%);
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 14px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-align: center;
}

.site-footer nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; }
.site-footer a { color: var(--muted); text-decoration: none; }
.site-footer a:hover { color: var(--green-dark); }

.card {
    width: 100%;
    max-width: 430px;
    position: relative;

    padding: 40px 40px 32px;

    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow);

    animation: cardIn .45s ease-out;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(14px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Decorative circles */

.card::before {
    content: "";
    position: absolute;

    width: 135px;
    height: 135px;

    top: -58px;
    right: -58px;

    border-radius: 50%;
    background: var(--green-soft);

    z-index: 0;
}

.card::after {
    content: "";
    position: absolute;

    width: 75px;
    height: 75px;

    bottom: -30px;
    left: -30px;

    border-radius: 50%;
    background: #eef4ff;

    z-index: 0;
}

.logo,
h1,
.subtitle,
form,
.login {
    position: relative;
    z-index: 1;
}

/* Logo */

.logo {
    width: 82px;
    height: 82px;

    margin: 0 auto 21px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--green-soft);
    border: 1px solid #d8f2c6;

    border-radius: 24px;

    font-size: 43px;

    box-shadow:
        0 7px 0 #d8efca,
        0 14px 25px rgba(88, 204, 2, .10);

    animation: owlPop .5s ease-out;
}

@keyframes owlPop {
    0% {
        opacity: 0;
        transform: scale(.7) rotate(-8deg);
    }

    70% {
        transform: scale(1.05) rotate(2deg);
    }

    100% {
        transform: scale(1) rotate(0);
    }
}

/* Heading */

h1 {
    margin: 0;

    text-align: center;

    color: var(--text);

    font-size: 30px;
    line-height: 1.15;
    font-weight: 900;
    letter-spacing: -.7px;
}

.subtitle {
    margin: 11px 0 25px;

    text-align: center;

    color: var(--muted);

    font-size: 15px;
    line-height: 1.55;
}

/* Error */

.error {
    position: relative;
    z-index: 2;

    margin-bottom: 18px;
    padding: 13px 15px;

    border: 1px solid #ffd0d0;
    border-radius: 13px;

    background: var(--red-soft);
    color: #d93636;

    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
}

/* Form */

form {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

label {
    margin-top: 7px;

    color: var(--text);

    font-size: 14px;
    font-weight: 800;
}

input {
    width: 100%;
    height: 51px;

    padding: 0 15px;

    border: 2px solid var(--border);
    border-radius: 14px;

    outline: none;

    background: #fff;
    color: var(--text);

    font-family: inherit;
    font-size: 15px;

    transition:
        border-color .15s ease,
        box-shadow .15s ease,
        transform .15s ease;
}

input::placeholder {
    color: #aab2bf;
}

input:hover {
    border-color: #d5dce5;
}

input:focus {
    border-color: var(--green);

    box-shadow:
        0 0 0 4px var(--green-soft);

    transform: translateY(-1px);
}

/* Submit */

button {
    width: 100%;
    height: 54px;

    margin-top: 14px;

    border: 0;
    border-radius: 14px;

    background: var(--green);
    color: #fff;

    font-family: inherit;
    font-size: 15px;
    font-weight: 900;

    cursor: pointer;

    box-shadow: 0 4px 0 var(--green-dark);

    transition:
        transform .12s ease,
        background .12s ease,
        box-shadow .12s ease;
}

button:hover {
    background: #61d609;
    transform: translateY(-1px);
}

button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--green-dark);
}

/* Login */

.login {
    margin-top: 23px;
    padding-top: 21px;

    border-top: 1px solid var(--border);

    text-align: center;

    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
}

.login a {
    margin-left: 4px;

    color: var(--green-dark);
    text-decoration: none;
    font-weight: 900;
}

.login a:hover {
    text-decoration: underline;
}

/* Mobile */

@media (max-width: 520px) {
    body {
        padding: 16px;
        align-items: flex-start;
        padding-top: 35px;
    }

    .card {
        padding: 34px 24px 28px;
        border-radius: 24px;
    }

    .logo {
        width: 72px;
        height: 72px;
        font-size: 37px;
        border-radius: 21px;
    }

    h1 {
        font-size: 27px;
    }
}
</style>

</head>

<body>

<div class="card">

    <div class="logo">
        🦉
    </div>

    <h1>LinguaFlow</h1>

    <p class="subtitle">
        Dil öğrenmeyi oyuna dönüştür.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">

        <label>Kullanıcı adı</label>

        <input
            name="username"
            type="text"
            placeholder="kullaniciadi"
            value="{{ username or '' }}"
            required
        >

        <label>E-posta</label>

        <input
            name="email"
            type="email"
            placeholder="you@example.com"
            value="{{ email or '' }}"
            required
        >

        <label>Şifre</label>

        <input
            name="password"
            type="password"
            placeholder="En az 8 karakter"
            required
        >

        <div style="margin:12px 0;color:#7c8799;font-size:12px;text-align:center;">
            Yeni hesaplar öğrenci olarak oluşturulur. Öğretmen yetkisi admin panelinden verilir.
        </div>

        <button type="submit">
            Hesap Oluştur →
        </button>

    </form>

    <div class="login">
        Zaten hesabın var mı?
        <a href="/auth/login">
            Giriş yap
        </a>
    </div>

        <footer class="site-footer">
            <span>© 2026 LinguaFlow</span>
            <nav aria-label="Legal and contact links">
                <a href="/terms">Terms of Service</a>
                <a href="/privacy">Privacy Policy</a>
                <a href="/refund">Refund Policy</a>
                <a href="/contact">Contact</a>
            </nav>
        </footer>
</div>

</body>
</html>
