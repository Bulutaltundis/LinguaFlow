[project]
name = "linguaflow"
version = "0.1.0"
description = "Gamified language learning platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.0",
    "pwdlib[argon2]>=0.3.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.35.0",
    "app-store-server-library>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
